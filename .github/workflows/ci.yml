name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flywheel_test
          POSTGRES_USER: flywheel
          POSTGRES_PASSWORD: flywheel_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flywheel -d flywheel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://flywheel:flywheel_test_only@localhost:5432/flywheel_test
      TEST_DATABASE_URL: postgresql+psycopg://flywheel:flywheel_test_only@localhost:5432/flywheel_test
      APP_ENV: test
      AI_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
      # Catches schema drift: an ORM model that no longer matches what the
      # migrations actually build. Nothing checked this before, and three
      # such drifts (a unique index reflected as a constraint, a missing
      # CheckConstraint, a redundant foreign key) reached main and had to be
      # found by hand on 2026-08-31. `alembic check` compares Base.metadata
      # against the freshly migrated database above and fails when they
      # disagree -- migrations/env.py already wires target_metadata, so this
      # needs no other setup.
      - run: alembic check
      - run: python -m pytest -q

  sibling_access:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.siblings.outputs.ready }}
    steps:
      - name: Check sibling repository access
        id: siblings
        env:
          READ_TOKEN: ${{ secrets.EVOROVE_SIBLINGS_READ_TOKEN }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cold e2e skipped: EVOROVE_SIBLINGS_READ_TOKEN is not configured for reading both sibling repositories."
          fi

  sibling-cold-e2e:
    needs: sibling_access
    if: needs.sibling_access.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: Evorove_CRM
      - uses: actions/checkout@v4
        with:
          repository: AleneSparrow/evorove_lead
          ref: main
          path: evorove_lead
          token: ${{ secrets.EVOROVE_SIBLINGS_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: AleneSparrow/Evorove
          ref: main
          path: Evorove
          token: ${{ secrets.EVOROVE_SIBLINGS_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install all three Python dependency sets
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Evorove_CRM/requirements.txt -r Evorove/requirements.txt -e ./evorove_lead
      - name: Test Cold handoff across repositories
        working-directory: Evorove_CRM
        env:
          AI_PROVIDER: deterministic
          EVOROVE_LEAD_PATH: ${{ github.workspace }}/evorove_lead
          EVOROVE_CYCLE2_PATH: ${{ github.workspace }}/Evorove
        run: python -m pytest -q -m sibling_e2e tests/test_cycle1_to_cycle2_e2e.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
